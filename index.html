<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Content</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="wrapper">
        <header class="head">
            <h1>This is <span id="updateSpan">No Joke</span></h1>
        </header>

        <main class="content">
            <p>
                Type some text and press update to change the heading above.
            </p>

            <input type="text" name="userInput" id="userInput" placeholder="Your text here...">
        </main>

        <footer class="foot">
            <button type="button" id="updateUIBtn">Update</button>
        </footer>
    </div>

    <script src="scripts/site.js"></script>
</body>
</html>
